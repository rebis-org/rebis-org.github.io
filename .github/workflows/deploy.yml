name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: "pages"
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - uses: nubjs/setup-nub@v0
        with:
          node-version-file: package.json
          cache: true
      - run: nub ci
      - run: nub run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: ${{ vars.SITE_URL }}
          ASTRO_BASE: ${{ steps.pages.outputs.base_path }}
          CI: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
