name: CI
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: nubjs/setup-nub@v0
        with:
          node-version: 24
          cache: true
      - run: nub ci
      - run: nub run fmt:check
      - run: nub run lint
      - run: nub run check
      - run: nub run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
